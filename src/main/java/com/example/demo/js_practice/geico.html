## **GEICO Homeowners Insurance Quote Application – Scenario Description**

**Purpose:**
The GEICO Homeowners Insurance Quote Application is designed to provide users with a **simple, guided, and interactive platform** to obtain homeowners insurance quotes. 
Users can enter **personal and property information**,
 optionally bundle existing insurance policies (like auto, motorcycle, or renters) for discounts, and receive **confirmation via email**.
  The system is **fully responsive**, integrates with a backend API, and supports **data validation and storage** in a database.

---

### **Target Users**

* Homeowners seeking new insurance coverage or switching providers.
* Existing GEICO policyholders interested in bundling multiple policies for discounts.
* Insurance agents or brokers who need to quickly collect accurate quote data.

---

### **Features**

1. **Step-by-Step Quote Form (UI)**
   The frontend is designed to guide users through structured sections:

   * **About You** – Collects personal info: first/last name, email, phone, current address, years at residence, prior address (if <2 years).
   * **Property Details** – Includes coverage start date, roof year, foundation type, basement, garage type, number of people, bathrooms, and appliance grade.
   * **Claims History** – Users indicate any property insurance claims in the past 7 years.
   * **Optional Bundles** – Users can select GEICO policies like Auto, Motorcycle, RV, or Renters to qualify for potential discounts.

2. **Validation and Prefill**

   * Prefills certain fields using public property records for convenience.
   * Ensures required fields are completed, numeric fields are within acceptable ranges, and dates fall within valid coverage windows.

3. **Backend Processing (Spring Boot)**

   * Receives frontend form data via **REST API**.
   * Validates data server-side before saving.
   * Stores user and property information in a **MySQL database**.
   * Sends email notifications via MailHog during development for testing.

4. **Database Design (MySQL)**

   * Primary tables: `user_info` and `property_details`.
   * Establishes foreign key relationships to link users with their property data.
   * Easily extendable for features like quote history, policy bundles, or reporting.

5. **Email Notifications**

   * Sends registration confirmation with quote details to the user’s email.
   * Ensures the user receives immediate acknowledgment of their submission.
   * MailHog captures emails during development and testing.

6. **API Testing (Postman)**

   * REST endpoints are testable with JSON payloads using Postman.
   * Facilitates backend validation, integration, and QA testing.

7. **Optional Features**

   * PDF/Excel generation of quote summary for users.
   * Dynamic eligibility checks for bundling discounts.
   * Historical reporting (monthly, weekly, yearly quotes).

---

### **User Workflow Example**

1. **Start Application**

   * User opens the GEICO Quote application in any browser or mobile device.
   * Sees a welcome page with “Bundle and Save” options.

2. **Fill Personal Info**

   * Enters first and last name, email, phone number, years at current residence, and ZIP code.
   * Optionally provides prior address if less than two years at current home.

3. **Property Details**

   * Selects coverage start date within allowed range.
   * Enters roof year, foundation type, garage type, number of people, bathrooms, and appliance grade.

4. **Insurance History**

   * Indicates any past property claims.

5. **Submit Form**

   * Data is sent via **POST request** to Spring Boot backend API.
   * Backend validates and stores data in MySQL and triggers confirmation email.

6. **Confirmation**

   * User sees a success message on the UI.
   * Receives email confirmation with quote details and optional PDF.

---

### **Technical Stack**

| Layer              | Technology            |
| ------------------ | --------------------- |
| Frontend           | HTML, JavaScript, CSS |
| Backend            | Spring Boot (Java)    |
| Database           | MySQL via XAMPP       |
| API Testing        | Postman               |
| Email Testing      | MailHog               |
| Optional Reporting | PDF/Excel generation  |

---

### **Key Benefits**

* **User-Friendly:** Step-by-step guidance reduces input errors and improves completion rate.
* **Cross-Platform:** Fully responsive design works on mobile, tablet, and desktop browsers.
* **Efficient Data Management:** Clean database design allows accurate storage and retrieval of user/property info.
* **Automated Communication:** Immediate email confirmations ensure user trust and engagement.
* **Scalable:** Easy to add features like dynamic quote calculations, bundling logic, or historical analytics.
* **Testable & Reliable:** Postman + MailHog workflow supports smooth development, testing, and QA.

## **Epic**

**Epic Title:**
**“GEICO Homeowners Insurance Quote System”**

**Epic Description:**
As a prospective homeowner, I want to **submit my personal and property details through a GEICO-branded web application**
 so that I can **receive an instant or personalized homeowners insurance quote**. The system should guide me through **step-by-step forms, validations, and instant feedback**,
  while being ready to integrate with **backend systems for database storage, email confirmations, and bundling discounts with other GEICO policies (auto, motorcycle, renters, etc.)**.

**Acceptance Criteria for Epic:**

1. Users can fill personal and property details in a stepwise, clear form.
2. Form validations ensure required fields are completed and data is valid.
3. Users receive visual confirmation of successful submission.
4. The system supports future integration with backend APIs, email notifications, and bundled insurance discounts.
5. The application UI is **responsive and GEICO-branded**, reflecting their brand colors, fonts, and style.

---

## **Breakdown of Scenarios / User Stories**

### **1. User Onboarding & Form Entry**

**Story:** As a GEICO user, I want to enter my personal information so that GEICO can identify me and contact me about my quote.

* **Acceptance Criteria:**

  * Fields: First Name, Last Name, Email (required), Phone, Years at Address (required), ZIP Code, Prior Address (optional).
  * Real-time HTML5 validation on required fields and proper formats.
  * Placeholders guide proper input.

---

### **2. Property Details Submission**

**Story:** As a user, I want to provide details about my home so GEICO can give an accurate insurance quote.

* **Acceptance Criteria:**

  * Fields: Coverage Start Date (selectable range), Roof Year, Foundation Type, Finished Basement, Garage Type, Number of People, Half Bathrooms, Appliance Grade, Past Claims.
  * Min/max constraints for numeric fields, dropdowns for Boolean/enum fields.
  * Guidance notes on date ranges and acceptable inputs.

---

### **3. Form Validation & Error Handling**

**Story:** As a user, I want the form to check my input before submission so that I don’t submit invalid data.

* **Acceptance Criteria:**

  * Required fields cannot be empty.
  * Numeric fields respect min/max constraints.
  * Dropdowns restrict Boolean values to valid options.
  * Users see clear inline error messages.

---

### **4. Submission Feedback**

**Story:** As a user, I want to know my quote request was successfully submitted so that I feel confident GEICO received it.

* **Acceptance Criteria:**

  * Submit button visually indicates success (checkmark, green color).
  * Alert confirms receipt and estimated response time.
  * Optional email confirmation if backend integration exists.

---

### **5. Backend Integration**

**Story:** As a system, I want to store user and property information so GEICO representatives can process quotes efficiently.

* **Acceptance Criteria:**

  * Data saved to MySQL or another relational database.
  * API endpoint accepts JSON payloads from frontend.
  * Email confirmation triggered to user using backend mail service.
  * Future scalability for PDF/Excel quote generation.

---

### **6. Bundling & Discounts**

**Story:** As a user, I want to optionally bundle GEICO policies (Auto, Motorcycle, RV, Renters) so that I can receive discounts.

* **Acceptance Criteria:**

  * Dropdown or checkbox dynamically shows eligible bundling options.
  * Backend can calculate bundled discount (optional future enhancement).
  * Users see which options are not available in real-time.

---

### **7. Responsive UI & Branding**

**Story:** As a user, I want the form to be **GEICO-branded** and responsive so that it works on any device and reinforces brand trust.

* **Acceptance Criteria:**

  * Colors, fonts, and icons follow GEICO brand guidelines (blue/white, clean fonts).
  * Flexbox or grid ensures proper layout on mobile.
  * Buttons and inputs are touch-friendly.

---

### **8. Analytics & Logging**

**Story:** As GEICO administrators, I want to log submissions and track form activity so that we can improve user experience and monitor requests.

* **Acceptance Criteria:**

  * Each submission logged with timestamp and user info.
  * Optional analytics integration for tracking funnel performance.
  * Reports can be generated for internal review.

---

  <script>
    function nextStep(stepNum) {

      const next = document.getElementById('step' + stepNum);
      next.classList.add('active');
      next.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('quoteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
