<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 30px;
    text-align: center;
}

.header h1 { font-size: 28px; margin-bottom: 10px; }
.header p { opacity: 0.9; font-size: 14px; }

.form-container { padding: 40px; }

.form-group { margin-bottom: 25px; }

label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }

input[type="email"], input[type="password"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #e1e5e9;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.signin-link {
    text-align: center;
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #e1e5e9;
    color: #666;
    font-size: 14px;
}

.signin-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
}

.signin-link a:hover { text-decoration: underline; }

.message {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: 500;
}

.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Mobile User: Sign In</h1>
        <p>Welcome back! Enter your credentials</p>
    </div>

    <div class="form-container">
        <div id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input id="email" type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input id="password" type="password" name="password" required>
            </div>
            <button id="loginBtn" type="submit" class="btn">Login</button>
        </form>

        <p style="margin-top:10px;text-align:center;">
            <a href="forgot_password.html" style="color:#667eea;text-decoration:none;">
                Forgot your password?
            </a>
        </p>

        <div class="signin-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    fetch("http://localhost:8080/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(res => {
        if (!res.ok) return res.json().then(err => Promise.reject(err));
        return res.json();
    })
    .then(response => {
        document.getElementById("message").innerHTML =
            `<div class="message success">${response.message}</div>`;
        // Optionally redirect after login
        if (response.success) {
            window.location.href = "profile.html";
        }
    })
    .catch(errors => {
        document.getElementById("message").innerHTML =
            `<div class="message error">${errors.message || errors.join("<br>")}</div>`;
    });
});
</script>

</body>
</html>
