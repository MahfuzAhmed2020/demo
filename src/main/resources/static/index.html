<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
    <title>Weather Home</title>
<style>


/* --------------------------for weather API WEBSERVICES--------------------------------*/
/* Weather Section */
.weather-section {
    margin-top: 40px;
    padding: 20px;
    text-align: center;
}

/* Input + Button container */
.weather-search {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;   /* Important for responsiveness */
    margin-bottom: 20px;
}

/* Input field */
.weather-search input {
    padding: 12px;
    width: 250px;
    max-width: 90%;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

/* Button */
.weather-search button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background-color: #0059ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.weather-search button:hover {
    background-color: #92b300;
}

/* Weather Card */
.weather-card {
    margin: auto;
    margin-top: 20px;
    padding: 20px;
    width: 320px;
    max-width: 95%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 15px;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: none; /* hidden until data loads */
}

/* Responsive for small screens */
@media (max-width: 600px) {

    .weather-search {
        flex-direction: column;
        align-items: center;
    }

    .weather-search input,
    .weather-search button {
        width: 100%;
        max-width: 300px;
    }

    .weather-card {
        width: 100%;
    }
}

/* --------------------------for weather API WEBSERVICES ENDS HERE--------------------------------*/

/* Flight Card */
.flight-card {
    margin: auto;
    margin-top: 20px;
    padding: 20px;
    width: 400px;
    max-width: 95%;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    border-radius: 15px;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: none;
}
</style>



</head>
<body>
    <h1>Weather_Spring Boot Running Successfully 🎉</h1>

<!-- to get the WEATHER webservices from -->
<div class="weather-section">
    <h2>🌤 Weather Update</h2>

    <div class="weather-search">
        <input type="text" id="weatherInput"
               placeholder="Enter city or zipcode">
        <button onclick="getWeather()">Get Weather</button>
    </div>

    <div id="weatherResult" class="weather-card"></div>
</div>
<!-- end-->

<h1>Check Ticket price</h1>
<div>
    <input type="text" id="from" placeholder="From (e.g. JFK)">
    <input type="text" id="to" placeholder="To (e.g. LAX)">
    <input type="date" id="date">
    <button onclick="getFlight()">Check Price</button>
</div>

<div id="flightResult" class="flight-card"></div>
<script>
/* --------------------------for weather API WEBSERVICES--------------------------------*/
function getWeather() {

    const query = document.getElementById("weatherInput").value;
     const card = document.getElementById("weatherResult");

    if (!query) {
       showError("Please enter city or zipcode.");
        return;
    }

    fetch(`http://localhost:8080/api/weather?query=${query}`)
        .then(response => response.json())
        .then(data => {

            const card = document.getElementById("weatherResult");
            card.style.display = "block";

            card.innerHTML = `
                <h3>${data.name}</h3>
                <p>🌡 Temperature: ${data.main.temp} °F</p>
                <p>💧 Humidity: ${data.main.humidity}%</p>
                <p>☁ Condition: ${data.weather[0].description}</p>
                <p>🌬 Wind: ${data.wind.speed} m/s</p>
            `;
        })
        .catch(error => {
            showError("❌ City or Zipcode not found.❌");
        });
}


function showError(message) {

    const card = document.getElementById("weatherResult");

    card.style.display = "block";
    card.innerHTML = `
        <div style="
            background-color: #00f2fe;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        ">
            ${message}
        </div>
    `;
}
/* --------------------------for weather API WEBSERVICES ENDS HERE--------------------------------*/

/*FLIGHT*/
function getFlight() {

    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const date = document.getElementById("date").value;

    const card = document.getElementById("flightResult");

    if (!from || !to || !date) {
        showFlightError("Please fill all fields.");
        return;
    }

    fetch(`http://localhost:8080/api/flight?from=${from}&to=${to}&date=${date}`)
        .then(response => response.json())
        .then(data => {

            card.style.display = "block";

            if (!data.data || data.data.length === 0) {
                showFlightError("No flights found.");
                return;
            }

            const offer = data.data[0];
            const price = offer.price.total;
            const currency = offer.price.currency;

            card.innerHTML = `
                <h3>✈ Flight Found</h3>
                <p><strong>From:</strong> ${from}</p>
                <p><strong>To:</strong> ${to}</p>
                <p><strong>Date:</strong> ${date}</p>
                <h2>💲 ${price} ${currency}</h2>
            `;
        })
        .catch(error => {
            showFlightError("Error retrieving flight data.");
        });
}

function showFlightError(message) {

    const card = document.getElementById("flightResult");

    card.style.display = "block";
    card.innerHTML = `
        <div style="
            background-color: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        ">
            ${message}
        </div>
    `;
}

</script>
