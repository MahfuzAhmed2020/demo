<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration</title>

<style>
/* YOUR EXACT CSS — NOT CHANGED */
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
body {background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px;}
.container {width:100%; max-width:500px; background:white; border-radius:15px; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden;}
.header {background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; padding:30px; text-align:center;}
.header h1 {font-size:28px; margin-bottom:10px;}
.header p {opacity:0.9; font-size:14px;}
.form-container {padding:40px;}
.form-group {margin-bottom:25px;}
.form-row {display:flex; gap:20px; margin-bottom:25px;}
.form-row .form-group {flex:1; margin-bottom:0;}
label {display:block; margin-bottom:8px; font-weight:600; color:#333; font-size:14px;}
input[type="text"], input[type="email"], input[type="password"] {width:100%; padding:14px; border:2px solid #e1e5e9; border-radius:8px; font-size:15px;}
.btn {width:100%; padding:16px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;}
.message {padding:15px; border-radius:8px; margin-bottom:20px; text-align:center; font-weight:500;}
.error {background:#f8d7da; color:#721c24;}
.success {background:#d4edda; color:#155724;}
</style>

</head>
<body>

<div class="container">
<div class="header">
<h1>Mobile User: Create Account</h1>
<p>Join our community today</p>
</div>

<div class="form-container">

<div id="message"></div>

<form id="registerForm">
<div class="form-row">
<div class="form-group">
<label>First Name</label>
<input type="text" name="first_name" required>
</div>
<div class="form-group">
<label>Last Name</label>
<input type="text" name="last_name" required>
</div>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" name="confirm_password" required>
</div>
        <div class="signin-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
        <br>
        <div>
            
        </div>
<button type="submit" class="btn">Sign Up</button>
</form>

</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    const data = {
        first_name: formData.get("first_name"),
        last_name: formData.get("last_name"),
        email: formData.get("email"),
        password: formData.get("password"),
        confirm_password: formData.get("confirm_password")
    };

    fetch("http://localhost:8080/api/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => {
        if (!res.ok) return res.json().then(err => Promise.reject(err));
        return res.text();
    })
    .then(response => {
        document.getElementById("message").innerHTML =
            `<div class="message success">${response}</div>`;
    })
    .catch(errors => {
        document.getElementById("message").innerHTML =
            `<div class="message error">${errors.join("<br>")}</div>`;
    });
});
</script>

</body>
</html>
